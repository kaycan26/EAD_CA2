name: CA2 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend build
      - name: Build Backend
        run: |
          cd EAD_BE_CA2
          mvn clean package -DskipTests

      # Frontend build
      - name: Build Frontend
        run: |
          cd EAD_FE_CA2
          npm install

      # Docker Compose build
      - name: Build and run containers
        run: |
          cd EAD_CA2_DOCKER
          docker compose up -d --build

      # Show running containers
      - name: Verify containers
        run: docker ps
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ead-backend ./EAD_BE_CA2
          docker push ${{ secrets.DOCKER_USERNAME }}/ead-backend

      - name: Build and push frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ead-frontend ./EAD_FE_CA2
          docker push ${{ secrets.DOCKER_USERNAME }}/ead-frontend
